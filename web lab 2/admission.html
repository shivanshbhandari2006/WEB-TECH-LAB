    <h3><u>STUDENT ADMISSION FORM</u> </h3>

<form action="https://www.youtube.com/watch?v=AETFvQonfV8" method="get" >

    <label for="student_name">Name:</label><br>

  <hr>_name" name="student_name" required  placeholder="enter your name"><br><br>
